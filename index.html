<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonjour depuis La Coloc</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; background: #1b1424; color: #f4ede2; font: 18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; }
  main { max-width: 34rem; text-align: center; }
  h1 { font-size: clamp(2.4rem, 8vw, 4.2rem); line-height: 1.05; color: #ff6b7a; text-shadow: 0 0 18px #ff3d55aa, 0 0 2px #fff; margin-bottom: 18px; }
  p { color: #cfc4d8; }
  .room { display: inline-block; margin-top: 28px; padding: 10px 18px; border-radius: 999px; background: #2a2035; color: #f4ede2; font-weight: 600; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #5ad17a; margin-right: 8px; box-shadow: 0 0 10px #5ad17a; }
</style>
</head>
<body>
<main>
  <h1>Bonjour depuis La Coloc</h1>
  <p>Cette page tourne dans la chambre de @djbrl, un vrai serveur partagé avec ses colocs.</p>
  <p class="room"><span class="dot"></span>En ligne depuis Dakar</p>
</main>
</body>
</html>
